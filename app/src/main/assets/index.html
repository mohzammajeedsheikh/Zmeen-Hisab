/* ---------- units ---------- */
const m=()=>S.marla, sar=()=>S.marla/9;
function mopts(){if(S.region=='ajk')return[272.25];if(S.mode=='shehri')return[225,250];if(S.region=='kpk')return[272.25,250];return[272.25]}
function fixMarla(){const o=mopts();if(!o.includes(S.marla))S.marla=o[0]}
function unitsDef(){
 const u={kanal:20*m(),marla:m(),sarsai:sar(),sqft:1};
 if(S.region!='ajk'){u.acre=S.mode=='dehati'?160*m():43560;u.karam=30.25;u.bigha=80*m();u.biswa=4*m()}
 if(S.mode=='dehati'&&S.region!='ajk')u.murabba=25*u.acre;
 if(S.mode=='shehri')u.gaz=9;
 return u}
const UORD=['kanal','marla','sarsai','sqft','acre','karam','bigha','biswa','murabba','gaz'];
const fmt=(n,d=2)=>isFinite(n)?(+(+n).toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d}):'-';
function split(sq){sq=Math.round(sq*1000)/1000;const K2=20*m();let k=Math.floor(sq/K2+1e-9),r=sq-k*K2,ma=Math.floor(r/m()+1e-9);r-=ma*m();if(r<0)r=0;return{k,ma,r}}
function kms(sq){const o=split(sq);let sa=Math.round(o.r/sar()*100)/100,r=Math.round(o.r*100)/100,ma=o.ma,k=o.k;if(sa>=9){sa=0;r=0;ma++}if(ma>=20){ma-=20;k++}return{k,ma,sa,sq:r}}
function kmsT(sq){const o=kms(sq);return `${o.k} ${t('kanal')} ${o.ma} ${t('marla')} ${fmt(o.sa)} ${t('sarsai')}`}
function kmsF(sq){const o=kms(sq);return `${o.k} ${t('kanal')} ${o.ma} ${t('marla')} ${fmt(o.sq)} ${t('sqft')}`}
function areaLines(sq){
 const L=[[t('kanal')+'-'+t('marla')+'-'+t('sarsai'),kmsT(sq)],[t('kanal')+'-'+t('marla')+'-'+t('sqft'),kmsF(sq)],[t('sqft'),fmt(sq)]];
 if(S.region!='ajk')L.push([t('acre'),fmt(sq/unitsDef().acre,4)]);
 if(S.region=='punjab'){const bg=80*m(),bi=4*m();const b=Math.floor(sq/bg+1e-9);L.push([t('bigha')+'-'+t('biswa'),`${b} ${t('bigha')} ${fmt((sq-b*bg)/bi)} ${t('biswa')}`])}
 return L}
const linesHtml=L=>`<div class="rbig">${L[0][1]}</div><div class="small">${L[0][0]}</div><div class="chips">${L.slice(1).map(x=>`<span>${x[0]}: <b>${x[1]}</b></span>`).join('')}</div>`;

/* ---------- fractions (exact) ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
const F=(n,d=1)=>{const g=gcd(Math.abs(n),d)||1;return{n:n/g,d:d/g}};
const fa=(x,y)=>F(x.n*y.d+y.n*x.d,x.d*y.d),fs=(x,y)=>F(x.n*y.d-y.n*x.d,x.d*y.d),fm=(x,y)=>F(x.n*y.n,x.d*y.d),fd=(x,y)=>F(x.n*y.d,x.d*y.n);
const fc=(x,y)=>x.n*y.d-y.n*x.d,fv=x=>x.n/x.d,fstr=x=>x.n==0?'0':x.d==1?String(x.n):x.n+'/'+x.d;
const ORDER=['h','w','s','d','f','m','b','sis','gs','gd'];
const sumF=sh=>Object.values(sh).reduce(fa,F(0));
const pack=(sh,c,notes)=>({rows:ORDER.filter(k=>sh[k]&&sh[k].n>0).map(k=>({k,n:c[k],f:sh[k]})),notes});
function radd(sh,skip,notes){
 const rem=fs(F(1),sumF(sh));if(rem.n<=0)return;
 let keys=Object.keys(sh).filter(k=>!skip.includes(k));if(!keys.length)keys=Object.keys(sh);
 const base=keys.reduce((a,k)=>fa(a,sh[k]),F(0));
 keys.forEach(k=>sh[k]=fa(sh[k],fm(rem,fd(sh[k],base))));notes.push('n_radd')}

/* ---------- Wirasat engines ---------- */
function hanafi(c){
 const sh={},notes=[],add=(k,f)=>{sh[k]=sh[k]?fa(sh[k],f):f};
 const desc=c.s+c.d+c.gs+c.gd>0;
 let gs=c.gs,gd=c.gd,b=c.b,si=c.sis;
 if(c.s>0){gs=0;gd=0}
 if(c.s==0&&c.d>=2&&gs==0)gd=0;
 if(c.s>0||gs>0||c.f>0){b=0;si=0}
 const sib=c.b+c.sis,maleD=c.s>0||gs>0,femD=!maleD&&(c.d>0||gd>0);
 let spouse=F(0);
 if(c.h){spouse=desc?F(1,4):F(1,2);add('h',spouse)}
 if(c.w){spouse=desc?F(1,8):F(1,4);add('w',spouse)}
 if(c.m){let f;if(desc||sib>=2)f=F(1,6);else if(c.f&&(c.h||c.w))f=fm(fs(F(1),spouse),F(1,3));else f=F(1,3);add('m',f)}
 if(c.f&&(maleD||femD))add('f',F(1,6));
 if(c.s==0){if(c.d==1)add('d',F(1,2));else if(c.d>=2)add('d',F(2,3))}
 if(c.s==0&&gs==0&&gd>0){if(c.d==0)add('gd',gd==1?F(1,2):F(2,3));else if(c.d==1)add('gd',F(1,6))}
 const sisAs=si>0&&b==0&&(c.d>0||gd>0);
 if(si>0&&b==0&&!sisAs)add('sis',si==1?F(1,2):F(2,3));
 const sum=sumF(sh);
 if(fc(sum,F(1))>0){Object.keys(sh).forEach(k=>sh[k]=fd(sh[k],sum));notes.push('n_awl');return pack(sh,c,notes)}
 const rem=fs(F(1),sum);
 if(rem.n>0){
  if(c.s>0){const u=2*c.s+c.d;add('s',fm(rem,F(2*c.s,u)));if(c.d)add('d',fm(rem,F(c.d,u)))}
  else if(gs>0){const u=2*gs+gd;add('gs',fm(rem,F(2*gs,u)));if(gd>0)add('gd',fm(rem,F(gd,u)))}
  else if(c.f)add('f',rem);
  else if(b>0){const u=2*b+si;add('b',fm(rem,F(2*b,u)));if(si)add('sis',fm(rem,F(si,u)))}
  else if(sisAs)add('sis',rem);
  else radd(sh,['h','w'],notes)}
 const r=pack(sh,c,notes);return r}
function jafaria(c){
 const sh={},notes=[],add=(k,f)=>{sh[k]=sh[k]?fa(sh[k],f):f};
 let s=c.s,d=c.d,gk=false;
 if(s+d==0&&c.gs+c.gd>0){s=c.gs;d=c.gd;gk=true}
 const sk=gk?'gs':'s',dk=gk?'gd':'d',desc=s+d>0,cls1=desc||c.f>0||c.m>0;
 const sibCond=c.f>0&&(c.b>=2||(c.b>=1&&c.sis>=2)||c.sis>=4);
 let spouse=F(0);
 if(c.h){spouse=desc?F(1,4):F(1,2);add('h',spouse)}
 if(c.w){spouse=desc?F(1,8):F(1,4);add('w',spouse)}
 if(cls1){
  if(c.m)add('m',(desc||sibCond)?F(1,6):F(1,3));
  if(c.f&&desc)add('f',F(1,6));
  if(s==0&&d>0)add(dk,d==1?F(1,2):F(2,3));
  const sum=sumF(sh);
  if(fc(sum,F(1))>0){const others=fs(sum,sh[dk]);sh[dk]=fs(F(1),others);notes.push('n_loss');return pack(sh,c,notes)}
  const rem=fs(F(1),sum);
  if(rem.n>0){
   if(s>0){const u=2*s+d;add(sk,fm(rem,F(2*s,u)));if(d)add(dk,fm(rem,F(d,u)))}
   else if(c.f&&!desc)add('f',rem);
   else radd(sh,sibCond?['h','w','m']:['h','w'],notes)}
 }else if(c.b+c.sis>0){
  const b=c.b,si=c.sis;
  if(b>0){const rem=fs(F(1),sumF(sh)),u=2*b+si;add('b',fm(rem,F(2*b,u)));if(si)add('sis',fm(rem,F(si,u)))}
  else{add('sis',si==1?F(1,2):F(2,3));const sum=sumF(sh);
   if(fc(sum,F(1))>0){sh.sis=fs(F(1),spouse);notes.push('n_loss')}else radd(sh,['h','w'],notes)}
 }else if(c.h||c.w){radd(sh,[],notes)}
 return pack(sh,c,notes)}

let P={n:4,u:'ft',v:{},area:0},XA=0;
const LT=i=>String.fromCharCode(65+i);
function pKeys(){const n=P.n,k=[];for(let i=0;i<n;i++)k.push(['s'+i,LT(i)+LT((i+1)%n),'s']);for(let j=2;j<=n-2;j++)k.push(['d'+j,LT(0)+LT(j),'d']);return k}

function pin(id,v){P.v[id]=v;calcP()}
function calcP(){
 const n=P.n,s=[],d={};
 for(let i=0;i<n;i++)s[i]=lenOf('s'+i);
 for(let j=2;j<=n-2;j++)d[j]=lenOf('d'+j);
 const pos=[[0,0]];if(!isNaN(s[0]))pos.push([s[0],0]);
 let area=0,full=true,err='';
 const lens=[];
 for(let i=1;i<=n-2;i++){
  const Lf=i==1?s[0]:d[i],Rt=i==n-2?s[n-1]:d[i+1],M=s[i];
  if([Lf,Rt,M].some(isNaN)){full=false;break}
  if(Lf+M<=Rt+1e-9||Lf+Rt<=M+1e-9||M+Rt<=Lf+1e-9){err=`${t('ptri')} ${LT(0)}${LT(i)}${LT(i+1)}`;full=false;break}
  const q=(Lf+M+Rt)/2;area+=Math.sqrt(Math.max(0,q*(q-Lf)*(q-M)*(q-Rt)));
  const P0=pos[0],Pi=pos[i],dd=Math.hypot(Pi[0]-P0[0],Pi[1]-P0[1]);
  const a=(Rt*Rt-M*M+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,Rt*Rt-a*a));
  const bx=P0[0]+a*(Pi[0]-P0[0])/dd,by=P0[1]+a*(Pi[1]-P0[1])/dd,px=-(Pi[1]-P0[1])/dd,py=(Pi[0]-P0[0])/dd;
  const c1=[bx+h*px,by+h*py],c2=[bx-h*px,by-h*py];
  const sp=i==1?-1:((Pi[0]-P0[0])*(pos[i-1][1]-P0[1])-(Pi[1]-P0[1])*(pos[i-1][0]-P0[0]));
  pos.push(sp<=0?c1:c2)}
 drawSketch(pos);
 const pr=$('pres'),pb=$('pbar');if(!pr)return;
 CUR=null;pb.style.display='none';
 if(err){pr.innerHTML=`<div class="err">${err}</div>`;return}
 if(!full||pos.length<n){pr.innerHTML=`<div class="small">${t('pwait')}</div>`;return}
 P.area=area*1;XA=area;const L=areaLines(area);
 pr.innerHTML=`<div class="res"><b>${t('result')}</b>${linesHtml(L)}</div><div class="warn">${t('pnote')}</div>`;pb.style.display='block';
 const rows=pKeys().map(([k,lab,ty])=>`<tr><td>${ty=='d'?t('diag'):t('side')} ${lab}</td><td>${fmt(lenOf(k),2)} ${t('ft')}</td></tr>`).join('');
 setCur('paim',t('paimaish'),`<div style="text-align:center">${$('sk').outerHTML}</div><table><tr><th>${t('side')}</th><th>${t('length')}</th></tr>${rows}</table><div class="res">${linesHtml(L)}</div><p>${t('pnote')}</p>`,`${n} ${t('sides')}\n${linesTxt(L)}\n\n${t('pnote')}`)}
function drawSketch(pos){
 const svg=$('sk');if(!svg)return;const W=300,Hh=240,pd=30;
 const xs=pos.map(p=>p[0]),ys=pos.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const sc=Math.min((W-2*pd)/Math.max(x1-x0,1e-6),(Hh-2*pd)/Math.max(y1-y0,1e-6));
 const X=p=>pd+(p[0]-x0)*sc+((W-2*pd)-(x1-x0)*sc)/2,Y=p=>Hh-pd-(p[1]-y0)*sc-((Hh-2*pd)-(y1-y0)*sc)/2;
 const cx=pos.reduce((a,p)=>a+X(p),0)/pos.length,cy=pos.reduce((a,p)=>a+Y(p),0)/pos.length;
 let o='';
 if(pos.length>=3)o+=`<polygon points="${pos.map(p=>X(p)+','+Y(p)).join(' ')}" fill="#cfe9d6" stroke="none"/>`;
 const ln=(a,b,dash,val)=>{o+=`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${dash?'#6aa57d':'#0f5a28'}" stroke-width="${dash?1.2:2.4}" ${dash?'stroke-dasharray="4 3"':''}/>`;
  if(val)o+=`<text x="${(X(a)+X(b))/2}" y="${(Y(a)+Y(b))/2-3}" font-size="9" fill="#333" text-anchor="middle">${fmt(val,1)}</text>`};
 for(let i=0;i<pos.length-1;i++)ln(pos[i],pos[i+1],false,lenOf('s'+i));
 if(pos.length==P.n)ln(pos[pos.length-1],pos[0],false,lenOf('s'+(P.n-1)));
 for(let j=2;j<=pos.length-2&&j<=P.n-2;j++)ln(pos[0],pos[j],true,lenOf('d'+j));
 pos.forEach((p,i)=>{let dx=X(p)-cx,dy=Y(p)-cy,dl=Math.hypot(dx,dy)||1;o+=`<circle cx="${X(p)}" cy="${Y(p)}" r="3.5" fill="#1b7a3a"/><text x="${X(p)+dx/dl*12}" y="${Y(p)+dy/dl*12+4}" font-size="13" font-weight="700" fill="#0f5a28" text-anchor="middle">${LT(i)}</text>`});
 svg.innerHTML=o}

SCR.wir=()=>{
 const steps=ORDER.map(k=>`<div class="step2"><b>${t('hr_'+k).replace(/\s*\(.*\)/,'')}</b><div><button onclick="wStep('${k}',-1)">−</button><span id="wc_${k}">${W.c[k]}</span><button onclick="wStep('${k}',1)">+</button></div></div>`).join('');
 page(t('wirasat'),`<div class="card"><h3>${t('wtot')}</h3>${aIn('wt','calcW()')}<details><summary>${t('wmore')}</summary><label class="l">${t('wfun')}</label>${aIn('wf','calcW()')}<label class="l">${t('wdebt')}</label>${aIn('wd','calcW()')}<label class="l">${t('wwas')}</label>${aIn('ww','calcW()')}</details></div>
 <div class="g2"><button id="fq_hanafi" class="btn sm" onclick="wFiqh('hanafi')">${t('hanafi')}</button><button id="fq_jafaria" class="btn sm" onclick="wFiqh('jafaria')">${t('jafaria')}</button></div>
 <h3 style="color:#0f5a28;margin:8px 4px">${t('w3')}</h3><div class="hgrid">${steps}</div><div id="wres"></div>`,true);
 if(W.pre){sA('wt',W.pre);W.pre=null}
 wFiqh(W.fiqh)};
function wFiqh(f){W.fiqh=f;['hanafi','jafaria'].forEach(x=>{$('fq_'+x).className='btn sm '+(x==f?'sel':'off')});calcW()}
function wStep(k,dl){const c=W.c;let v=Math.max(0,Math.min(k in MAXH?MAXH[k]:30,c[k]+dl));c[k]=v;
 if(k=='h'&&v>0)c.w=0;if(k=='w'&&v>0)c.h=0;ORDER.forEach(x=>$('wc_'+x).textContent=c[x]);calcW()}
function calcW(){
 const tot=rA('wt'),fu=rA('wf'),db=rA('wd'),wa=rA('ww');
 const net=Math.max(0,tot-fu-db),was=Math.min(wa,net/3),dist=net-was;
 let L=[[t('wtot'),kmsT(tot)],[t('wfun'),kmsT(fu)],[t('wdebt'),kmsT(db)],[t('wwas'),kmsT(was)],[t('wdist'),kmsT(dist)+' ('+fmt(dist)+' '+t('sqft')+')']];
 let h=`<div class="res">${L.map(x=>`<div>${x[0]}: <b>${x[1]}</b></div>`).join('')}${wa>net/3+1e-9?`<div class="warn">${t('wcap')}</div>`:''}</div>`;
 const c=W.c,any=ORDER.some(k=>c[k]>0);CUR=null;
 if(!any){$('wres').innerHTML=h+`<div class="small">${t('noheir')}</div>`;return}
 const r=W.fiqh=='hanafi'?hanafi(c):jafaria(c);
 const blk=['b','sis','gs','gd','f','m','s','d','h','w'].filter(k=>c[k]>0&&!r.rows.some(x=>x.k==k)).map(k=>t('hr_'+k));
 const notes=r.notes.map(t);if(blk.length)notes.push(t('n_blk')+': '+blk.join('، '));
 let tf=F(0);const rows=r.rows.map(x=>{tf=fa(tf,x.f);const sq=dist*fv(x.f);
  return{nm:t('hr_'+x.k).replace(/\s*\(.*\)/,'')+(x.n>1?' × '+x.n:''),fr:fstr(x.f),pc:fmt(fv(x.f)*100)+'%',a:kmsT(sq),sq:fmt(sq),each:x.n>1?kmsT(sq/x.n)+' ('+fmt(sq/x.n)+' '+t('sqft')+')':''}});
 const tr=rows.map(x=>`<tr><td><b>${x.nm}</b></td><td>${x.fr}<br>${x.pc}</td><td>${x.a}<br><span class="small">${x.sq} ${t('sqft')}</span>${x.each?`<br><span class="small">${t('each')}: ${x.each}</span>`:''}</td></tr>`).join('');
 const chk=fc(tf,F(1))==0;
 h+=`<div class="card"><table><tr><th>${t('heir')}</th><th>${t('frac')} / %</th><th>${t('area')}</th></tr>${tr}<tr><th>${t('total')}</th><th>${chk?'100%':fmt(fv(tf)*100)+'%'}</th><th>${kmsT(dist)}</th></tr></table></div>${notes.map(n=>`<div class="warn">${n}</div>`).join('')}<div class="warn">${t('wnote')}</div>${bar()}`;
 $('wres').innerHTML=h;
 const fq=t(W.fiqh);
 setCur('wir',t('wirasat'),`<p>${t('fard')}: ${K.no?t('khata')+' '+K.no:''} ${K.owner||''} | ${fq}</p><div class="res">${L.map(x=>`<div>${x[0]}: <b>${x[1]}</b></div>`).join('')}</div><table><tr><th>${t('heir')}</th><th>${t('frac')}</th><th>%</th><th>${t('area')}</th><th>${t('sqft')}</th></tr>${rows.map(x=>`<tr><td>${x.nm}</td><td>${x.fr}</td><td>${x.pc}</td><td>${x.a}${x.each?'<br>'+t('each')+': '+x.each:''}</td><td>${x.sq}</td></tr>`).join('')}<tr><th>${t('total')}</th><th>1</th><th>100%</th><th>${kmsT(dist)}</th><th>${fmt(dist)}</th></tr></table>${notes.map(n=>`<p>${n}</p>`).join('')}<p>${t('wnote')}</p>`,
  `${t('wirasat')} (${fq})\n${L.map(x=>x[0]+': '+x[1]).join('\n')}\n\n`+rows.map(x=>`${x.nm}: ${x.fr} = ${x.pc}\n   ${x.a} (${x.sq} ${t('sqft')})${x.each?'\n   '+t('each')+': '+x.each:''}`).join('\n')+`\n\n${t('total')}: 100%\n${t('wnote')}`)}

/* ----- Map & GPS Paimaish (needs internet for the map; GPS points work offline) ----- */
let G={pts:[],map:null,gps:null,centered:false,ov:[],area:0},GPSCB=null,GW=null,gpsRun=false;
function gpsOn(){if(gpsRun)return;gpsRun=true;if(A&&A.startGps)A.startGps();else if(navigator.geolocation)GW=navigator.geolocation.watchPosition(p=>window.onGps(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>window.onGpsErr('perm'),{enableHighAccuracy:true})}
function gpsOff(){if(!gpsRun)return;gpsRun=false;if(A&&A.stopGps)A.stopGps();if(GW!==null){navigator.geolocation.clearWatch(GW);GW=null}}
window.onGps=(la,lo,ac)=>{G.gps={la,lo,ac};const e=$('gstat');if(e)e.textContent=t('gpsacc')+': '+fmt(ac,0)+' m';
 if(G.map&&!G.centered){G.centered=true;G.map.setView([la,lo],18)}
 if(GPSCB){const f=GPSCB;GPSCB=null;f(la,lo)}};
window.onGpsErr=()=>{gpsRun=false;toast(t('gpserr'))};
function proj(pts){const la0=pts.reduce((a,p)=>a+p[0],0)/pts.length,lo0=pts.reduce((a,p)=>a+p[1],0)/pts.length,k=Math.cos(la0*Math.PI/180);return pts.map(p=>[(p[1]-lo0)*111320*k,(p[0]-la0)*110574])}
function polyArea(xy){let a=0;for(let i=0;i<xy.length;i++){const j=(i+1)%xy.length;a+=xy[i][0]*xy[j][1]-xy[j][0]*xy[i][1]}return Math.abs(a)/2*10.7639}
function polyPer(xy){let d=0;for(let i=0;i<xy.length;i++){const j=(i+1)%xy.length;d+=Math.hypot(xy[i][0]-xy[j][0],xy[i][1]-xy[j][1])}return d*3.28084}
function polySvg(xy){if(xy.length<2)return '';const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(Math.max(...xs)-x0,1e-6),h=Math.max(Math.max(...ys)-y0,1e-6),sc=Math.min(240/w,180/h);
 const P2=xy.map(p=>[30+(p[0]-x0)*sc,210-(p[1]-y0)*sc]);
 return `<svg viewBox="0 0 300 240" width="100%"><polygon points="${P2.map(p=>p.join(',')).join(' ')}" fill="#cfe9d6" stroke="#0f5a28" stroke-width="2.4"/>${P2.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#1b7a3a"/><text x="${p[0]+6}" y="${p[1]-6}" font-size="12" font-weight="700" fill="#0f5a28">${i+1}</text>`).join('')}</svg>`}
function loadLeaflet(ok,fail){if(window.L)return ok();
 const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);
 const j=document.createElement('script');let done=false;const f=()=>{if(!done){done=true;fail()}};
 j.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';j.onload=()=>{if(!done){done=true;ok()}};j.onerror=f;setTimeout(f,9000);document.head.appendChild(j)}
SCR.map=()=>{

 page(t('map'),`<div class="card"><div class="small">${t('maptip')}</div>
 <div class="g2" style="margin-top:6px"><input id="g_q" placeholder="${t('search')}"><button class="btn sm" style="margin:0" onclick="gSearch()">🔍 ${t('search')}</button></div></div>
 <div class="g2"><button class="btn sm" onclick="gLayer('sat')">🛰️ ${t('satellite')}</button><button class="btn sm alt" onclick="gLayer('osm')">🗺️ ${t('street')}</button></div>

 <div class="small" id="gstat">${t('gpswait')}</div>

 gpsOn();calcG();

let GL={};
function initMap(){const e=$('mapbox');if(!e||!window.L)return;
 G.map=L.map('mapbox').setView(G.gps?[G.gps.la,G.gps.lo]:[30.4,69.3],G.gps?18:5);
 GL.sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:18,attribution:'Esri'});

 GL.sat.addTo(G.map);GL.cur='sat';
 G.map.on('click',ev=>gAdd(ev.latlng.lat,ev.latlng.lng));
 if(G.gps)G.centered=true;else if(G.pts.length)G.map.setView(G.pts[0],18);
 gDraw()}
function gLayer(x){if(!G.map||GL.cur==x)return;G.map.removeLayer(GL[GL.cur]);GL[x].addTo(G.map);GL.cur=x}

 if(G.pts.length>=3)G.ov.push(L.polygon(G.pts,{color:'#ffeb3b',weight:3,fillColor:'#1b7a3a',fillOpacity:.3}).addTo(G.map));
 else if(G.pts.length==2)G.ov.push(L.polyline(G.pts,{color:'#ffeb3b',weight:3}).addTo(G.map));
 G.pts.forEach((p,i)=>G.ov.push(L.circleMarker(p,{radius:7,color:'#fff',weight:2,fillColor:'#1b7a3a',fillOpacity:1}).bindTooltip(String(i+1),{permanent:true,direction:'top'}).addTo(G.map)))}

function calcG(){
 const r=$('gres');if(!r)return;CUR=null;const n=G.pts.length;$('gbar').style.display='none';
 const sk=$('gsk');if(sk)sk.innerHTML=polySvg(n?proj(G.pts):[]);
 if(n<3){r.innerHTML=`<div class="small">${t('points')}: ${n}</div>`;return}
 const xy=proj(G.pts),sq=polyArea(xy);G.area=sq;XA=sq;
 const c=[G.pts.reduce((a,p)=>a+p[0],0)/n,G.pts.reduce((a,p)=>a+p[1],0)/n],link=`https://maps.google.com/?q=${c[0].toFixed(6)},${c[1].toFixed(6)}`;
 const L2=areaLines(sq);L2.push([t('perim'),fmt(polyPer(xy),0)]);
